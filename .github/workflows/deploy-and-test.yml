name: Deploy & E2E Test – ShadeScanAI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# ── Required for GitHub Pages deployment ─────────────────────
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ════════════════════════════════════════════════════════════
  #  JOB 1 ─ Build React/Vite frontend
  # ════════════════════════════════════════════════════════════
  build:
    name: Build Vite Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build with Vite (base = /ShadeScanAI/)
        run: npm run build -- --base /ShadeScanAI/
        env:
          VITE_FIREBASE_API_KEY:              ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:          ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:           ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:       ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID:  ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:               ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-dist
          path: web/dist
          retention-days: 1

  # ════════════════════════════════════════════════════════════
  #  JOB 2 ─ Run 1,100 Selenium E2E tests
  # ════════════════════════════════════════════════════════════
  e2e:
    name: Selenium E2E (1,100 assertions)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download built dist
        uses: actions/download-artifact@v4
        with:
          name: vite-dist
          path: web/dist

      # ── Install Chrome + ChromeDriver ─────────────────────
      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      # ── Install frontend deps (for vite preview) ──────────
      - name: Install frontend deps
        working-directory: web
        run: npm ci

      # ── Install E2E suite deps ─────────────────────────────
      - name: Install E2E dependencies
        working-directory: web/ShadeScanAIE2E
        run: npm ci

      # ── Start Vite preview server in background ───────────
      - name: Start Vite preview server
        working-directory: web
        run: |
          npx vite preview --port 5173 --host 127.0.0.1 --base /ShadeScanAI/ &
          echo "VITE_PID=$!" >> $GITHUB_ENV

      - name: Wait for preview server to be ready
        run: |
          sleep 4
          for i in $(seq 1 15); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://127.0.0.1:5173/ShadeScanAI/ || echo "000")
            echo "Attempt $i – HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "304" ]; then
              echo "✅ Preview server is up"
              break
            fi
            sleep 2
          done

      - name: Export TEST_BASE_URL
        run: echo "TEST_BASE_URL=http://127.0.0.1:5173/ShadeScanAI" >> $GITHUB_ENV

      # ── Run E2E suite ──────────────────────────────────────
      - name: Run 1,100 Selenium E2E tests
        working-directory: web/ShadeScanAIE2E
        env:
          TEST_BASE_URL: ${{ env.TEST_BASE_URL }}
        run: npm test
        continue-on-error: true   # Always produce reports even on failure

      # ── Stop Vite preview ──────────────────────────────────
      - name: Stop Vite preview server
        if: always()
        run: kill $VITE_PID 2>/dev/null || true

      # ── Upload raw test artifacts ──────────────────────────
      - name: Upload Excel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-excel-report
          path: web/ShadeScanAIE2E/Test_Results/Excel/selenium-report.xlsx
          retention-days: 30

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-html-report
          path: web/ShadeScanAIE2E/Test_Results/HTML/execution-report.html
          retention-days: 30

      # ── Store reports in dist for unified GH Pages deploy ─
      - name: Inject HTML report into dist (latest)
        if: always()
        run: |
          mkdir -p web/dist/reports/latest
          mkdir -p web/dist/reports/history/build-${{ github.run_number }}
          cp web/ShadeScanAIE2E/Test_Results/HTML/execution-report.html \
             web/dist/reports/latest/execution-report.html || echo "Report not found – skipping copy"
          cp web/ShadeScanAIE2E/Test_Results/HTML/execution-report.html \
             web/dist/reports/history/build-${{ github.run_number }}/execution-report.html || true

      # ── Re-upload dist with reports embedded ──────────────
      - name: Upload unified dist artifact (with reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vite-dist-with-reports
          path: web/dist
          retention-days: 1

      # ── Step summary ──────────────────────────────────────
      - name: Write step summary
        if: always()
        run: |
          TOTAL=1100
          PASS=$(grep -c "passing" web/ShadeScanAIE2E/Test_Results/HTML/execution-report.html 2>/dev/null || echo "N/A")
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 🦷 ShadeScanAI – Selenium E2E Results

          | Metric | Value |
          |--------|-------|
          | **Total Assertions** | 1,100 |
          | **Categories** | 110 |
          | **Build #** | ${{ github.run_number }} |
          | **Commit** | `${{ github.sha }}` |
          | **Branch** | `${{ github.ref_name }}` |

          ### 📊 Reports

          | Report | Link |
          |--------|------|
          | 📄 HTML Report (latest) | [View on GitHub Pages](https://$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]').github.io/${{ github.event.repository.name }}/reports/latest/execution-report.html) |
          | 📦 Excel Artifact | Download from **Actions → Artifacts → selenium-excel-report** |
          | 📝 HTML Artifact  | Download from **Actions → Artifacts → selenium-html-report** |

          > Tests run against local Vite preview (`http://127.0.0.1:5173/ShadeScanAI`)
          EOF

  # ════════════════════════════════════════════════════════════
  #  JOB 3 ─ Deploy unified dist to GitHub Pages
  # ════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: e2e
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download unified dist artifact
        uses: actions/download-artifact@v4
        with:
          name: vite-dist-with-reports
          path: dist-to-deploy

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-to-deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🚀 Deployment

          | Item | URL |
          |------|-----|
          | **Live App** | [${{ steps.deployment.outputs.page_url }}](${{ steps.deployment.outputs.page_url }}) |
          | **Latest E2E Report** | [${{ steps.deployment.outputs.page_url }}reports/latest/execution-report.html](${{ steps.deployment.outputs.page_url }}reports/latest/execution-report.html) |
          | **Build #${{ github.run_number }} Report** | [${{ steps.deployment.outputs.page_url }}reports/history/build-${{ github.run_number }}/execution-report.html](${{ steps.deployment.outputs.page_url }}reports/history/build-${{ github.run_number }}/execution-report.html) |
          EOF
